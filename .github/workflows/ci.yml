name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Ruff lint
        run: uv run ruff check --output-format=github

      - name: Ruff format
        run: uv run ruff format --check

      - name: Type check
        run: uv run basedpyright

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Verify the wheel imports and reports its version
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          import execution_timer
          print('version:', execution_timer.__version__)
          with execution_timer.TimerContext('smoke'):
              pass
          assert execution_timer.get_execution_timings()
          print('wheel smoke test passed')
          "

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # The release workflow hands distributions between jobs with this same pair of actions,
      # a path nothing else exercises until a release is already under way.
      - name: Download them back
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist-roundtrip/

      # Compares the distributions themselves rather than the whole directory: uv build
      # leaves a .gitignore in dist/, and upload-artifact omits hidden files by design.
      - name: Verify the round-trip is byte-identical
        run: |
          for built in dist/*.whl dist/*.tar.gz; do
            cmp "$built" "dist-roundtrip/$(basename "$built")"
            echo "round-tripped unchanged: $(basename "$built")"
          done

  # Single required status check for branch protection. Requiring the matrix jobs by name
  # would wedge every pull request the moment the matrix changes, because the old names
  # stop reporting and GitHub waits on them forever.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs did not succeed."
          exit 1
