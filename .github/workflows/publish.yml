name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --isolated --no-project --with dist/*.whl \
            python -c 'import execution_timer; print(execution_timer.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag '$tag' does not match package version '$version'"
            exit 1
          fi
          echo "Tag and package version agree: $version"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/execution-timer
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token is stored anywhere.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
