name: Bug report
description: Report incorrect behaviour or a crash
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest snippet that shows the problem.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: executiontimer version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version and OS
      placeholder: "3.12.4 on macOS 15"
    validations:
      required: true
