<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 152" width="620" height="152" role="img" aria-label="execution-timer">
  <title>execution-timer</title>
  <defs>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <!-- Stopwatch stem and crown -->
  <rect x="62" y="16" width="16" height="14" rx="4" fill="#94A3B8"/>
  <rect x="55" y="10" width="30" height="9" rx="4.5" fill="#94A3B8"/>

  <!-- Unfilled tracks -->
  <circle cx="70" cy="76" r="42" fill="none" stroke="#334155" stroke-width="8"/>
  <circle cx="70" cy="76" r="31" fill="none" stroke="#334155" stroke-width="8"/>
  <circle cx="70" cy="76" r="20" fill="none" stroke="#334155" stroke-width="8"/>

  <!-- Nested arcs: each ring is one level of the timing hierarchy -->
  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M 70 34 A 42 42 0 1 1 28.64 83.29" stroke="url(#ring1)"/>
    <path d="M 70 45 A 31 31 0 1 1 64.62 106.53" stroke="url(#ring2)"/>
    <path d="M 70 56 A 20 20 0 0 1 80 93.32" stroke="url(#ring3)"/>
  </g>

  <!-- Wordmark -->
  <text x="146" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1">
    <tspan fill="#F1F5F9">execution-</tspan><tspan fill="#818CF8">timer</tspan>
  </text>
  <text x="148" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="0.6" fill="#94A3B8">Hierarchical execution timing for Python</text>
</svg>
